replicaCount: 2

image:
  repository: ghcr.io/abhayshekhawat1428/learn-cicd
  tag: "main"
  pullPolicy: Always

service:
  type: NodePort
  port: 9000
  targetPort: 8080
  nodePort: 30080

config:
  APP_NAME: "dd-api"
  APP_VERSION: "v1"
  LOG_LEVEL: "INFO"
  DB_HOST: "learn-sybase.internal"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi
