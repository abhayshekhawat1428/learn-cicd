name: CI Pipeline

# Trigger: runs on every push and every pull request to main
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  # Job 1: Run tests
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run tests
        run: npm test
